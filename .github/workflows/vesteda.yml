name: Vesteda Watcher

on:
  # Every 5 min during work hours, Mon–Fri (Europe/Rome) using UTC approximation
  schedule:
    - cron: "*/5 7-15 * 3-10 1-5"       # Mar–Oct: 09–17 Rome ≈ 07–15 UTC
    - cron: "*/5 8-16 * 11,12,1,2 1-5"  # Nov–Feb: 09–17 Rome ≈ 08–16 UTC
  workflow_dispatch: {}                  # manual "Run workflow" button

concurrency:
  group: vesteda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright/python:v1.47.0-jammy  # browsers & OS deps preinstalled

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Install the Python libs we use; tzdata fixes ZoneInfo("Europe/Amsterdam")
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.47.0 python-dotenv requests tzdata

      # Do ONE pass and exit (ideal for cron). Increase to 150–180s if your connection/site is slow.
      - name: Run watcher (single pass)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          SINGLE_PASS: "1"
        run: python vesteda_watch.py
       
          timeout 120s python vesteda_watch.py || true
