name: Vesteda Watcher

on:
  schedule:
    - cron: "*/5 7-15 * 3-10 1-5"       # Mar–Oct: 09–17 Rome ≈ 07–15 UTC
    - cron: "*/5 8-16 * 11,12,1,2 1-5"  # Nov–Feb: 09–17 Rome ≈ 08–16 UTC
  workflow_dispatch: {}

concurrency:
  group: vesteda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright/python:v1.47.0-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.47.0 python-dotenv requests tzdata

      - name: Sanity check Gist access
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python - <<'PY'
          import os, requests, sys
          r = requests.get(
            f"https://api.github.com/gists/{os.environ['GIST_ID']}",
            headers={"Authorization": f"Bearer {os.environ['GIST_TOKEN']}",
                     "Accept":"application/vnd.github+json"},
            timeout=20
          )
          print("HTTP", r.status_code, r.text[:180])
          sys.exit(0 if r.status_code==200 else 1)
          PY

      - name: Run watcher (single pass)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          SINGLE_PASS: "1"
        run: python vesteda_watch.py

      # Optional: if a debug screenshot was saved, upload it
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesteda-debug
          path: |
            vesteda_debug*.png
      - name: Upload debug artifacts
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: vesteda-debug
    path: |
      vesteda_debug*.png
      vesteda_debug*.html
    if-no-files-found: ignore
          if-no-files-found: ignore
