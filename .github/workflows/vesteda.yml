name: Vesteda Watcher

on:
  schedule:
    - cron: "*/5 7-15 * 3-10 1-5"       # Mar–Oct: every 5 min Mon–Fri (09–17 Rome ≈ 07–15 UTC)
    - cron: "*/5 8-16 * 11,12,1,2 1-5"  # Nov–Feb: every 5 min Mon–Fri (09–17 Rome ≈ 08–16 UTC)
  workflow_dispatch: {}

concurrency:
  group: vesteda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright/python:v1.47.0-jammy

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Browsers & OS deps are already in the container.
      # We still need the Python packages in THIS 
 - name: Install Python deps
    run: |
    python -m pip install --upgrade pip
    pip install playwright==1.47.0 python-dotenv requests 
- name: Run watcher (single pass)
  env:
    TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  run: |
    timeout 120s python vesteda_watch.py || true
