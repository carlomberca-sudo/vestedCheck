name: Vesteda Watcher

on:
  schedule:
    - cron: "*/5 7-15 * 3-10 1-5"       # Mar–Oct: every 5 min Mon–Fri, 09–17 Rome ≈ 07–15 UTC
    - cron: "*/5 8-16 * 11,12,1,2 1-5"  # Nov–Feb: every 5 min Mon–Fri, 09–17 Rome ≈ 08–16 UTC
  workflow_dispatch: {}

concurrency:
  group: vesteda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.47.0-jammy

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Python deps (fast)
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv requests playwright==1.47.0

      # Browsers are already in the container, but this is quick and safe
      - name: Ensure Playwright browsers present
        run: |
          python -c "import playwright; print(playwright.__version__)"
          playwright install

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vesteda_watch.py
